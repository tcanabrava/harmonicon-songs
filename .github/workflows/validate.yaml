name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Checks this pack the way the game will read it, with the validator of
  # Harmonicon's main branch: every song has a chart, and every chart loads
  # as the game loads it (schema, format version, a real harmonica).
  validate:
    name: validate-pack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout this pack
        uses: actions/checkout@v4
        with:
          path: pack
      - name: Checkout Harmonicon
        uses: actions/checkout@v4
        with:
          repository: tcanabrava/harmonicon
          path: harmonicon
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            harmonicon/target/
          key: ${{ runner.os }}-validate-pack-${{ hashFiles('harmonicon/Cargo.lock') }}
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Dependencies
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev
      - name: Validate
        working-directory: harmonicon
        run: cargo run --release --bin validate-pack -- ../pack
